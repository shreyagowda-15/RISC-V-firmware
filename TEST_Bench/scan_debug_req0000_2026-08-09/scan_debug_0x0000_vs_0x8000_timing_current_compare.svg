<polyline class="cur0" points="240,550.1 450,550.1 470,542.1 640,542.1 660,542.1 1130,542.1"/><polyline class="cur8" points="240,547.5 450,547.5 470,521.9 640,521.9 660,544.9 1130,544.9"/>
