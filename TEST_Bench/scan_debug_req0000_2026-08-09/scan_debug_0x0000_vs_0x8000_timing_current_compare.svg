<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Scan debug 0x0000 and 0x8000 current waveform comparison">
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#1f2937}.title{font-size:22px;font-weight:700}.small{font-size:12px;fill:#4b5563}.axis{stroke:#6b7280;stroke-width:1}.lane{stroke:#e5e7eb;stroke-width:1}.cur0{fill:none;stroke:#2563eb;stroke-width:2}.cur8{fill:none;stroke:#ea580c;stroke-width:2}.phase{opacity:.5}.muted{fill:#6b7280}</style>
<text x="24" y="34" class="title">Same-rail scan-debug current waveform comparison</text>
<text x="24" y="58" class="small">Blue = 0x0000 run, orange = 0x8000 run. Labels are absolute mean current in each window.</text>
<rect x="240" y="82" width="210" height="560" class="phase" fill="#d9ead3"/><text x="345" y="104" text-anchor="middle">pre</text>
<rect x="470" y="82" width="170" height="560" class="phase" fill="#fce5cd"/><text x="555" y="104" text-anchor="middle">TM low / reset boot</text>
<rect x="660" y="82" width="470" height="560" class="phase" fill="#d9eaf7"/><text x="895" y="104" text-anchor="middle">post scan-debug hold</text>
<text x="875" y="42" class="small">0x0000</text><line class="cur0" x1="930" y1="38" x2="970" y2="38"/><text x="990" y="42" class="small">0x8000</text><line class="cur8" x1="1045" y1="38" x2="1085" y2="38"/>
<text x="24" y="170" font-weight="700">Saleae A10-A9</text><text x="24" y="190" class="small">shifted to A2-A3</text>
<line class="lane" x1="240" y1="200" x2="1130" y2="200"/>
<polyline class="cur0" points="240,161.9 450,161.9 470,172.6 640,172.6 660,169.1 1130,169.1"/><polyline class="cur8" points="240,179.3 450,179.3 470,190.1 640,190.1 660,182.0 1130,182.0"/>
<text x="345" y="153.9" text-anchor="middle" class="small">0x0000 645.63 uA</text>
<text x="555" y="164.6" text-anchor="middle" class="small">0x0000 643.55 uA</text>
<text x="895" y="161.1" text-anchor="middle" class="small">0x0000 644.22 uA</text>
<text x="345" y="195.3" text-anchor="middle" class="small">0x8000 642.25 uA</text>
<text x="555" y="206.1" text-anchor="middle" class="small">0x8000 640.16 uA</text>
<text x="895" y="198.0" text-anchor="middle" class="small">0x8000 641.73 uA</text>
<text x="24" y="290" font-weight="700">ADC A0-A1</text><text x="24" y="310" class="small">set pair</text>
<line class="lane" x1="240" y1="320" x2="1130" y2="320"/>
<polyline class="cur0" points="240,292.0 450,292.0 470,289.1 640,289.1 660,298.4 1130,298.4"/><polyline class="cur8" points="240,302.9 450,302.9 470,302.2 640,302.2 660,297.2 1130,297.2"/>
<text x="345" y="284.0" text-anchor="middle" class="small">0x0000 -26.99 uA</text>
<text x="555" y="281.1" text-anchor="middle" class="small">0x0000 -26.85 uA</text>
<text x="895" y="290.4" text-anchor="middle" class="small">0x0000 -27.29 uA</text>
<text x="345" y="318.9" text-anchor="middle" class="small">0x8000 -27.50 uA</text>
<text x="555" y="318.2" text-anchor="middle" class="small">0x8000 -27.47 uA</text>
<text x="895" y="313.2" text-anchor="middle" class="small">0x8000 -27.23 uA</text>
<text x="24" y="410" font-weight="700">ADC A2-A3</text><text x="24" y="430" class="small">read pair</text>
<line class="lane" x1="240" y1="440" x2="1130" y2="440"/>
<polyline class="cur0" points="240,403.8 450,403.8 470,404.9 640,404.9 660,415.3 1130,415.3"/><polyline class="cur8" points="240,401.9 450,401.9 470,430.1 640,430.1 660,417.7 1130,417.7"/>
<text x="345" y="395.8" text-anchor="middle" class="small">0x0000 605.18 uA</text>
<text x="555" y="396.9" text-anchor="middle" class="small">0x0000 604.98 uA</text>
<text x="895" y="407.3" text-anchor="middle" class="small">0x0000 603.19 uA</text>
<text x="345" y="417.9" text-anchor="middle" class="small">0x8000 605.50 uA</text>
<text x="555" y="446.1" text-anchor="middle" class="small">0x8000 600.64 uA</text>
<text x="895" y="433.7" text-anchor="middle" class="small">0x8000 602.77 uA</text>
<text x="24" y="530" font-weight="700">ADC A4-A5</text><text x="24" y="550" class="small">reset pair</text>
<line class="lane" x1="240" y1="560" x2="1130" y2="560"/>
<polyline class="cur0" points="240,521.9 450,521.9 470,529.9 640,529.9 660,529.9 1130,529.9"/><polyline class="cur8" points="240,524.5 450,524.5 470,550.1 640,550.1 660,527.1 1130,527.1"/>
<text x="345" y="513.9" text-anchor="middle" class="small">0x0000 -17.36 uA</text>
<text x="555" y="521.9" text-anchor="middle" class="small">0x0000 -19.32 uA</text>
<text x="895" y="521.9" text-anchor="middle" class="small">0x0000 -19.32 uA</text>
<text x="345" y="540.5" text-anchor="middle" class="small">0x8000 -18.00 uA</text>
<text x="555" y="566.1" text-anchor="middle" class="small">0x8000 -24.29 uA</text>
<text x="895" y="543.1" text-anchor="middle" class="small">0x8000 -18.64 uA</text>
<line class="axis" x1="240" y1="670" x2="1130" y2="670"/><text x="240" y="695" text-anchor="middle" class="small">pre start</text><text x="555" y="695" text-anchor="middle" class="small">TM-low window</text><text x="895" y="695" text-anchor="middle" class="small">post hold</text>
</svg>
