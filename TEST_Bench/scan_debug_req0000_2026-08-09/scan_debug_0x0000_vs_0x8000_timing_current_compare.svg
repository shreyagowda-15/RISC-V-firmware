<text x="555" y="534.1" text-anchor="middle" class="small">0x0000 19.32 uA</text>
<text x="895" y="534.1" text-anchor="middle" class="small">0x0000 19.32 uA</text>
<text x="345" y="565.5" text-anchor="middle" class="small">0x8000 18.00 uA</text>
<text x="555" y="539.9" text-anchor="middle" class="small">0x8000 24.29 uA</text>
<text x="895" y="562.9" text-anchor="middle" class="small">0x8000 18.64 uA</text>
<line class="axis" x1="240" y1="670" x2="1130" y2="670"/><text x="240" y="695" text-anchor="middle" class="small">pre start</text><text x="555" y="695" text-anchor="middle" class="small">TM-low window</text><text x="895" y="695" text-anchor="middle" class="small">post hold</text>
